# ============================================================================
#  Dovecot — top-level configuration
# ============================================================================

# IMAP for clients, LMTP for inbound delivery from Postfix, Sieve for filters.
protocols = imap lmtp sieve

listen = *

# Log to stderr so `docker logs` captures everything.
log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr

!include conf.d/*.conf
