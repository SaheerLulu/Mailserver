# --- Service listeners -------------------------------------------------------

service imap-login {
  inet_listener imap  { port = 143 }
  inet_listener imaps { port = 993 }
}

# Inbound delivery from Postfix over the internal network.
service lmtp {
  inet_listener lmtp { port = 24 }
}

# SASL authentication for Postfix (submission/SMTPS) plus the local
# userdb socket used by doveadm.
service auth {
  inet_listener sasl {
    port = 12345
  }
  unix_listener auth-userdb {
    mode = 0660
    user = vmail
    group = vmail
  }
}

service auth-worker {
  user = vmail
}

service managesieve-login {
  inet_listener sieve { port = 4190 }
}
