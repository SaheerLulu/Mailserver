# --- TLS ---------------------------------------------------------------------
# `required` forces TLS for all IMAP/ManageSieve sessions (implicit on 993,
# STARTTLS on 143). LMTP/auth happen on the trusted internal network.
ssl = required
ssl_cert = </etc/ssl/mail/fullchain.pem
ssl_key = </etc/ssl/mail/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = no
