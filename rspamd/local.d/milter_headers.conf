# Headers rspamd adds to scanned mail. The "spam-header" routine stamps
# "X-Spam: Yes" on messages that reach the add-header action — which the
# default Dovecot Sieve script uses to file them into Junk.
extended_spam_headers = true;

use = ["x-spamd-result", "x-spam-status", "x-spam-level", "authentication-results", "spam-header"];

routines {
  spam-header {
    header = "X-Spam";
    value = "Yes";
  }
}

authenticated_headers = ["authentication-results"];
