# ============================================================================
#  Django mail server — service orchestration
#
#    postgres — database (domains, mailboxes, aliases, stored messages)
#    web      — Gunicorn serving the webmail UI + Django admin (:8000)
#    smtp     — the SMTP listeners: inbound MTA (:25) + submission (:587)
#
#  `web` and `smtp` are the same image in different roles, sharing the DB and
#  the media volume (stored .eml files and attachments).
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: django-mailserver
    command: ["web"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5

  smtp:
    build: .
    image: django-mailserver
    command: ["smtp"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      web:
        condition: service_healthy   # ensures migrations have run
    volumes:
      - media:/app/media
      - ./certs:/app/certs:ro        # optional STARTTLS material
    ports:
      - "25:25"
      - "587:587"

volumes:
  postgres-data:
  media:
